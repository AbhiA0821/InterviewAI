# -----------------------------------------------------------------------
# InterviewAI - Docker Compose (local development)
#
# Brings up the backend (FastAPI) and frontend (Vite dev server) together.
# For production, the frontend is deployed to Vercel and the backend to
# Render — this compose file is intended for local/dev use.
# -----------------------------------------------------------------------
version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interviewai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interviewai-frontend
    ports:
      - "4173:4173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

# NOTE: For local Postgres testing (instead of SQLite), a `db` service
